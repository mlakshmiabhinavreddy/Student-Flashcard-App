<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Exam Results — STUDYFLIP. Review your performance.">
    <title>Exam Results — STUDYFLIP</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;500;600&display=swap" rel="stylesheet">
        <link rel="stylesheet" href="/static/css/base.css?v=4">
    <link rel="stylesheet" href="/static/css/layout.css?v=4">
    <link rel="stylesheet" href="/static/css/components.css?v=4">
    <link rel="stylesheet" href="/static/css/pages.css?v=4">
    <script src="https://unpkg.com/lucide@latest"></script>
</head>
<body>
<div class="app-container">

    <!-- ── Sidebar Navigation ──────────────────────────── -->
    <nav class="sidebar" id="sidebar">
        <div class="sidebar-header">
            <a href="/dashboard" class="sidebar-brand">
                <i data-lucide="zap" class="brand-icon"></i>
                <span class="sidebar-brand-text">STUDYFLIP</span>
            </a>
            <button class="sidebar-collapse-btn" onclick="toggleSidebarCollapse()" title="Collapse Sidebar">
                <i data-lucide="chevron-left" id="collapse-icon"></i>
            </button>
        </div>
        <ul class="sidebar-nav">
            <li><a href="/dashboard" class="sidebar-link" id="nav-dashboard">
                <i data-lucide="layout-dashboard"></i> <span class="link-text">Dashboard</span>
            </a></li>
            <li><a href="/decks" class="sidebar-link" id="nav-decks">
                <i data-lucide="library"></i> <span class="link-text">My Decks</span>
            </a></li>
            <li><a href="/smart-review" class="sidebar-link" id="nav-review">
                <i data-lucide="brain"></i> <span class="link-text">Smart Review</span>
            </a></li>
            <li><a href="/mock-exam" class="sidebar-link" id="nav-exam">
                <i data-lucide="file-text"></i> <span class="link-text">Mock Exams</span>
            </a></li>
            <li><a href="/progress" class="sidebar-link" id="nav-progress">
                <i data-lucide="trending-up"></i> <span class="link-text">Progress</span>
            </a></li>
        </ul>
        <div class="sidebar-footer">
            <div class="sidebar-user">
                <div class="sidebar-user-avatar">{{ user.name[0].upper() if user else 'U' }}</div>
                <div class="sidebar-user-info">
                    <span class="sidebar-user-name">{{ user.name if user else 'User' }}</span>
                </div>
            </div>
            <a href="/logout" class="sidebar-logout" title="Logout">
                <i data-lucide="log-out"></i> <span class="link-text">Logout</span>
            </a>
        </div>
    </nav>

    <!-- ── Mobile top bar ──────────────────────────────── -->
    <div class="mobile-topbar">
        <button class="mobile-menu-btn" onclick="toggleSidebar()" aria-label="Menu">
            <i data-lucide="menu"></i>
        </button>
        <span class="mobile-brand"><i data-lucide="zap"></i> STUDYFLIP</span>
        <a href="/logout" class="mobile-logout"><i data-lucide="log-out"></i></a>
    </div>

    <!-- ── Main Content ────────────────────────────────── -->
    <main class="main-content" id="app-main">
        <div id="result-container">
            <div class="loading">
                <div class="loading-spinner"></div>
                <p>Loading results...</p>
            </div>
        </div>
    </main>

    <div id="toast-container" class="toast-container"></div>

    <script>
        const EXAM_ID = {{ exam_id }};
    </script>
    <script src="/static/js/exam_result.js"></script>
    
    <script src="/static/js/app.js?v=2"></script>
    <script>lucide.createIcons();</script>
</div>
</body>
</html>
